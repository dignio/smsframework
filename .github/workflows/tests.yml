name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Match the Flask/Werkzeug versions used by v2-server
      - run: pip install -e . -r requirements-dev.txt "flask==2.2.5" "werkzeug==2.2.3"
      - run: pytest tests/
